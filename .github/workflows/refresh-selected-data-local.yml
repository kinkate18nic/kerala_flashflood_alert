name: Refresh selected sources (local runner test)

on:
  workflow_dispatch:
    inputs:
      imd_cap_rss:
        description: IMD CAP RSS
        required: false
        default: false
        type: boolean
      imd_flash_flood_bulletin:
        description: IMD Flash Flood Bulletin
        required: false
        default: false
        type: boolean
      indiawris_rainfall:
        description: India-WRIS CWC Rainfall
        required: false
        default: false
        type: boolean
      indiawris_river_level:
        description: India-WRIS CWC River Water Level
        required: false
        default: false
        type: boolean
      ksdma_reservoirs:
        description: KSDMA Daily Dam Levels (KSEB)
        required: false
        default: false
        type: boolean
      ksdma_dam_management:
        description: KSDMA Daily Dam Levels (Irrigation)
        required: false
        default: false
        type: boolean
      cwc_ffs:
        description: CWC FFS Live River Levels
        required: false
        default: true
        type: boolean
      rainviewer_radar:
        description: RainViewer Radar Nowcast
        required: false
        default: false
        type: boolean
      nasa_imerg_nrt:
        description: NASA IMERG Near-Real-Time
        required: false
        default: false
        type: boolean
      operator_observations:
        description: Operator Observation Override
        required: false
        default: false
        type: boolean
      run_tests:
        description: Run npm test before refresh
        required: false
        default: false
        type: boolean
      ffs_curl_diagnostic:
        description: Run FFS curl diagnostic before refresh
        required: false
        default: true
        type: boolean
      send_telegram:
        description: Send Telegram alerts after refresh
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: refresh-flood-data-local
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: [self-hosted, windows, ffs-local]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        shell: powershell
        run: npm ci

      - name: Resolve selected sources
        shell: powershell
        run: |
          $ids = @()
          if ("${{ inputs.imd_cap_rss }}" -eq "true") { $ids += "imd-cap-rss" }
          if ("${{ inputs.imd_flash_flood_bulletin }}" -eq "true") { $ids += "imd-flash-flood-bulletin" }
          if ("${{ inputs.indiawris_rainfall }}" -eq "true") { $ids += "indiawris-rainfall" }
          if ("${{ inputs.indiawris_river_level }}" -eq "true") { $ids += "indiawris-river-level" }
          if ("${{ inputs.ksdma_reservoirs }}" -eq "true") { $ids += "ksdma-reservoirs" }
          if ("${{ inputs.ksdma_dam_management }}" -eq "true") { $ids += "ksdma-dam-management" }
          if ("${{ inputs.cwc_ffs }}" -eq "true") { $ids += "cwc-ffs" }
          if ("${{ inputs.rainviewer_radar }}" -eq "true") { $ids += "rainviewer-radar" }
          if ("${{ inputs.nasa_imerg_nrt }}" -eq "true") { $ids += "nasa-imerg-nrt" }
          if ("${{ inputs.operator_observations }}" -eq "true") { $ids += "operator-observations" }

          if ($ids.Count -eq 0) {
            Write-Error "No sources selected."
          }

          $sourceIds = $ids -join ","
          "SOURCE_IDS=$sourceIds" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "Selected sources: $sourceIds"

      - name: Run tests
        if: ${{ inputs.run_tests }}
        shell: powershell
        run: npm test

      - name: Run FFS curl diagnostic
        if: ${{ inputs.cwc_ffs && inputs.ffs_curl_diagnostic }}
        shell: powershell
        run: |
          $outCsv = Join-Path $env:RUNNER_TEMP "ffs-gha-curl-test.csv"
          $headers = @{
            "Accept" = "application/json, text/plain, */*"
            "Referer" = "https://ffs.india-water.gov.in/#/main/site"
            "User-Agent" = "KeralaFlashFloodWatch/0.1 (+https://github.com/kinkate18nic/kerala_flashflood_alert)"
          }

          $registry = Get-Content -Raw "data/manual/indiawris-stations.json" | ConvertFrom-Json
          $stations = @($registry.stations | Where-Object { $_.station_code -and $_.source_types -contains "river_level" })
          $results = @()
          $failures = 0

          foreach ($station in $stations) {
            $sortCriteria = @{ sortOrderDtos = @(@{ sortDirection = "DESC"; field = "id.dataTime" }) } | ConvertTo-Json -Compress -Depth 6
            $specification = @{
              where = @{
                where = @{
                  expression = @{
                    valueIsRelationField = $false
                    fieldName = "id.stationCode"
                    operator = "eq"
                    value = $station.station_code
                  }
                }
                and = @{
                  expression = @{
                    valueIsRelationField = $false
                    fieldName = "id.datatypeCode"
                    operator = "eq"
                    value = "HHS"
                  }
                }
              }
              and = @{
                expression = @{
                  valueIsRelationField = $false
                  fieldName = "dataValue"
                  operator = "null"
                  value = "false"
                }
              }
            } | ConvertTo-Json -Compress -Depth 10

            $url = "https://ffs.india-water.gov.in/iam/api/new-entry-data/specification/sorted-page?sort-criteria=$([uri]::EscapeDataString($sortCriteria))&page-number=0&page-size=2&specification=$([uri]::EscapeDataString($specification))"

            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            try {
              $resp = Invoke-WebRequest -UseBasicParsing -Uri $url -Headers $headers -TimeoutSec 15
              $sw.Stop()
              $body = [string]$resp.Content
              $type =
                if ($body.StartsWith("[")) {
                  if ($body.Trim() -eq "[]") { "empty-json" } else { "rows-json" }
                } elseif ($body.StartsWith("{")) {
                  "object-json"
                } elseif ($body.StartsWith("<")) {
                  $failures++
                  "html"
                } else {
                  $failures++
                  "other"
                }

              $rows = if ($type -eq "rows-json") { 2 } else { 0 }
              $error = if ($type -eq "html") { "html_instead_of_json" } elseif ($type -eq "other") { "non_json_response" } else { "" }

              $results += [PSCustomObject]@{
                station = $station.station_name
                code = $station.station_code
                district = $station.district_id
                status = 200
                type = $type
                rows = $rows
                ms = $sw.ElapsedMilliseconds
                error = $error
              }
            } catch {
              $sw.Stop()
              $failures++
              $results += [PSCustomObject]@{
                station = $station.station_name
                code = $station.station_code
                district = $station.district_id
                status = 599
                type = "exception"
                rows = 0
                ms = $sw.ElapsedMilliseconds
                error = $_.Exception.Message
              }
            }

            Start-Sleep -Milliseconds 800
          }

          $results | Export-Csv -NoTypeInformation -Encoding UTF8 $outCsv

          $summaryLines = @(
            "## FFS curl diagnostic",
            "",
            "- Stations tested: $($results.Count)",
            "- Failures: $failures",
            "- CSV artifact: ffs-gha-curl-test-local",
            "",
            "### Type counts"
          )
          $summaryLines += ($results | Group-Object type | ForEach-Object { "- $($_.Count) $($_.Name)" })
          $summaryLines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload FFS curl diagnostic
        if: ${{ inputs.cwc_ffs && inputs.ffs_curl_diagnostic }}
        uses: actions/upload-artifact@v4
        with:
          name: ffs-gha-curl-test-local
          path: ${{ runner.temp }}/ffs-gha-curl-test.csv

      - name: Build live data (selected sources)
        shell: powershell
        env:
          PPS_EMAIL: ${{ secrets.PPS_EMAIL }}
          PPS_PASSWORD: ${{ secrets.PPS_PASSWORD }}
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: node scripts/run-pipeline.js

      - name: Build static site
        shell: powershell
        run: node scripts/build-site.js

      - name: Send reviewed severe alerts
        if: ${{ inputs.send_telegram }}
        shell: powershell
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/send-telegram.js

      - name: Commit refreshed data
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs runtime data/manual/review-approvals.json
          if (git diff --cached --quiet) {
            Write-Output "No changes to commit"
          } else {
            git commit -m "chore: refresh selected sources (local runner)"
            git push
          }
