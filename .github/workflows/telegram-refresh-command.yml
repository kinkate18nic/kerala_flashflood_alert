name: Telegram refresh commands

on:
  repository_dispatch:
    types:
      - telegram_refresh_command

permissions:
  actions: write
  contents: write

concurrency:
  group: telegram-refresh-command
  cancel-in-progress: false

jobs:
  command:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Apply Telegram refresh command
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_COMMAND_TEXT: ${{ github.event.client_payload.command_text }}
          TELEGRAM_COMMAND_ACTOR: ${{ github.event.client_payload.actor }}
          TELEGRAM_COMMAND_AT: ${{ github.event.client_payload.command_at }}
          TELEGRAM_REPLY_CHAT_ID: ${{ github.event.client_payload.reply_chat_id }}
        run: node scripts/telegram-command-dispatch.js

      - name: Apply workflow pause state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/set-refresh-workflow-state.js

      - name: Commit Telegram refresh state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manual/ops-state.json data/manual/review-approvals.json data/manual/review-rejections.json
          if git diff --cached --quiet; then
            echo "No Telegram refresh state changes to commit"
          else
            git commit -m "chore: apply telegram refresh command"
            git pull --rebase --autostash origin main
            git push
          fi
