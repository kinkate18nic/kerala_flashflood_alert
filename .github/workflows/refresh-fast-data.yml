name: Refresh India fast sources (local)

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      force_live_fetch:
        description: Force a live fetch for selected sources instead of reusing cadence cache
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: refresh-india-fast-local
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: [self-hosted, windows, ffs-local]
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Trust workspace for git
        run: git config --global --add safe.directory "$env:GITHUB_WORKSPACE"

      - name: Reset leftover git operation state
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE\\.git\\rebase-merge") {
            git -C "$env:GITHUB_WORKSPACE" rebase --abort
            Remove-Item -Recurse -Force "$env:GITHUB_WORKSPACE\\.git\\rebase-merge"
          }
          if (Test-Path "$env:GITHUB_WORKSPACE\\.git\\rebase-apply") {
            git -C "$env:GITHUB_WORKSPACE" am --abort
            Remove-Item -Recurse -Force "$env:GITHUB_WORKSPACE\\.git\\rebase-apply"
          }
          if (Test-Path "$env:GITHUB_WORKSPACE\\.git\\MERGE_HEAD") {
            git -C "$env:GITHUB_WORKSPACE" merge --abort
          }
          if (Test-Path "$env:GITHUB_WORKSPACE\\.git\\CHERRY_PICK_HEAD") {
            git -C "$env:GITHUB_WORKSPACE" cherry-pick --abort
          }

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check refresh control state
        id: refresh_control
        run: |
          $opsPath = Join-Path $env:GITHUB_WORKSPACE "data/manual/ops-state.json"
          if (-not (Test-Path $opsPath)) {
            "should_run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "status_message=No ops-state file found; refresh will proceed." | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $ops = Get-Content $opsPath -Raw | ConvertFrom-Json
          if ($ops.refresh_paused) {
            "should_run=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "status_message=Refresh paused via Telegram; this run will exit without updating sources." | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "should_run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "status_message=Refresh is active." | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Install dependencies
        if: steps.refresh_control.outputs.should_run == 'true'
        run: npm ci

      - name: Run tests
        if: steps.refresh_control.outputs.should_run == 'true'
        run: npm test

      - name: Refresh source cache (India fast sources)
        if: steps.refresh_control.outputs.should_run == 'true'
        env:
          PPS_EMAIL: ${{ secrets.PPS_EMAIL }}
          PPS_PASSWORD: ${{ secrets.PPS_PASSWORD }}
          NODE_OPTIONS: "--dns-result-order=ipv4first"
          ENABLE_CADENCE_REUSE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_live_fetch && 'false' || 'true' }}
          WRITE_PUBLIC_OUTPUTS: "false"
          WRITE_ARCHIVE_OUTPUTS: "false"
          WRITE_RUNTIME_DERIVED: "false"
          WRITE_METRICS: "false"
          WRITE_RAW_OUTPUTS: "false"
          SOURCE_IDS: "imd-cap-rss,imd-flash-flood-bulletin,imd-district-warning,imd-district-nowcast,imd-station-nowcast,operator-observations"
        run: node scripts/run-pipeline.js

      - name: Commit refreshed data
        if: steps.refresh_control.outputs.should_run == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$env:GITHUB_WORKSPACE" add runtime/cache/source-results.json data/manual/review-approvals.json
          if (git -C "$env:GITHUB_WORKSPACE" diff --cached --quiet) {
            Write-Output "No changes to commit"
          } else {
            git -C "$env:GITHUB_WORKSPACE" commit -m "chore: refresh india fast sources"
            git -C "$env:GITHUB_WORKSPACE" pull --rebase --autostash origin main
            git -C "$env:GITHUB_WORKSPACE" push
          }

      - name: Report paused refresh
        if: steps.refresh_control.outputs.should_run != 'true'
        run: Write-Output "${{ steps.refresh_control.outputs.status_message }}"
