name: Refresh India fast sources (local)

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-india-fast-local
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: [self-hosted, windows, ffs-local]
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Trust workspace for git
        run: git config --global --add safe.directory "$env:GITHUB_WORKSPACE"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build live data (India fast sources)
        env:
          PPS_EMAIL: ${{ secrets.PPS_EMAIL }}
          PPS_PASSWORD: ${{ secrets.PPS_PASSWORD }}
          NODE_OPTIONS: "--dns-result-order=ipv4first"
          ENABLE_CADENCE_REUSE: "true"
          SOURCE_IDS: "imd-cap-rss,imd-flash-flood-bulletin,imd-district-warning,imd-district-nowcast,operator-observations"
        run: node scripts/run-pipeline.js

      - name: Build static site
        run: node scripts/build-site.js

      - name: Send reviewed severe alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/send-telegram.js

      - name: Commit refreshed data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$env:GITHUB_WORKSPACE" add docs runtime data/manual/review-approvals.json
          if (git -C "$env:GITHUB_WORKSPACE" diff --cached --quiet) {
            Write-Output "No changes to commit"
          } else {
            git -C "$env:GITHUB_WORKSPACE" commit -m "chore: refresh india fast sources"
            git -C "$env:GITHUB_WORKSPACE" push
          }
