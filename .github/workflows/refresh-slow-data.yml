name: Refresh India hydrology (local)

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-india-hydrology-local
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: [self-hosted, windows, ffs-local]
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Trust workspace for git
        run: git config --global --add safe.directory "$env:GITHUB_WORKSPACE"

      - name: Reset leftover git operation state
        run: |
          git -C "$env:GITHUB_WORKSPACE" rebase --abort 2>$null
          git -C "$env:GITHUB_WORKSPACE" merge --abort 2>$null
          git -C "$env:GITHUB_WORKSPACE" am --abort 2>$null
          git -C "$env:GITHUB_WORKSPACE" cherry-pick --abort 2>$null
          if (Test-Path "$env:GITHUB_WORKSPACE\\.git\\rebase-merge") {
            Remove-Item -Recurse -Force "$env:GITHUB_WORKSPACE\\.git\\rebase-merge"
          }
          if (Test-Path "$env:GITHUB_WORKSPACE\\.git\\rebase-apply") {
            Remove-Item -Recurse -Force "$env:GITHUB_WORKSPACE\\.git\\rebase-apply"
          }

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Refresh source cache (India hydrology)
        env:
          PPS_EMAIL: ${{ secrets.PPS_EMAIL }}
          PPS_PASSWORD: ${{ secrets.PPS_PASSWORD }}
          NODE_OPTIONS: "--dns-result-order=ipv4first"
          ENABLE_CADENCE_REUSE: "true"
          WRITE_PUBLIC_OUTPUTS: "false"
          WRITE_ARCHIVE_OUTPUTS: "false"
          WRITE_RUNTIME_DERIVED: "false"
          WRITE_METRICS: "false"
          WRITE_RAW_OUTPUTS: "false"
          SOURCE_IDS: "indiawris-rainfall,indiawris-river-level,ksdma-reservoirs,ksdma-dam-management,cwc-ffs"
        run: node scripts/run-pipeline.js

      - name: Commit refreshed data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$env:GITHUB_WORKSPACE" add runtime/cache/source-results.json data/manual/review-approvals.json
          if (git -C "$env:GITHUB_WORKSPACE" diff --cached --quiet) {
            Write-Output "No changes to commit"
          } else {
            git -C "$env:GITHUB_WORKSPACE" commit -m "chore: refresh india hydrology"
            git -C "$env:GITHUB_WORKSPACE" pull --rebase --autostash origin main
            git -C "$env:GITHUB_WORKSPACE" push
          }
