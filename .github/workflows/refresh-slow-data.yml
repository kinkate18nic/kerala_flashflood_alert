name: Refresh India hydrology (local)

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-india-hydrology-local
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: [self-hosted, windows, ffs-local]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        shell: powershell
        run: npm ci

      - name: Run tests
        shell: powershell
        run: npm test

      - name: Build live data (India hydrology)
        shell: powershell
        env:
          PPS_EMAIL: ${{ secrets.PPS_EMAIL }}
          PPS_PASSWORD: ${{ secrets.PPS_PASSWORD }}
          NODE_OPTIONS: "--dns-result-order=ipv4first"
          ENABLE_CADENCE_REUSE: "true"
          SOURCE_IDS: "indiawris-rainfall,indiawris-river-level,ksdma-reservoirs,ksdma-dam-management,cwc-ffs"
        run: node scripts/run-pipeline.js

      - name: Build static site
        shell: powershell
        run: node scripts/build-site.js

      - name: Send reviewed severe alerts
        shell: powershell
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/send-telegram.js

      - name: Commit refreshed data
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs runtime data/manual/review-approvals.json
          if (git diff --cached --quiet) {
            Write-Output "No changes to commit"
          } else {
            git commit -m "chore: refresh india hydrology"
            git push
          }
