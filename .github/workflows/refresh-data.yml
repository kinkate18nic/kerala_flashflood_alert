name: Refresh external sources

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-external-sources
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Refresh source cache (external sources)
        env:
          PPS_EMAIL: ${{ secrets.PPS_EMAIL }}
          PPS_PASSWORD: ${{ secrets.PPS_PASSWORD }}
          NODE_OPTIONS: "--dns-result-order=ipv4first"
          ENABLE_CADENCE_REUSE: "true"
          WRITE_PUBLIC_OUTPUTS: "false"
          WRITE_ARCHIVE_OUTPUTS: "false"
          WRITE_RUNTIME_DERIVED: "false"
          WRITE_METRICS: "false"
          WRITE_RAW_OUTPUTS: "false"
          SOURCE_IDS: "rainviewer-radar,nasa-imerg-nrt"
        run: node scripts/run-pipeline.js

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/cache/source-results.json data/manual/review-approvals.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh external sources"
            git pull --rebase --autostash origin main
            git push
          fi
