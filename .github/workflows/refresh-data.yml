name: Refresh external sources

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: refresh-external-sources
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check refresh control state
        id: refresh_control
        run: |
          node -e "const fs=require('fs'); const path='data/manual/ops-state.json'; if(!fs.existsSync(path)){console.log('should_run=true'); console.log('status_message=No ops-state file found; refresh will proceed.'); process.exit(0);} const ops=JSON.parse(fs.readFileSync(path,'utf8')); if(ops.refresh_paused){console.log('should_run=false'); console.log('status_message=Refresh paused via Telegram; this run will exit without updating sources.');} else {console.log('should_run=true'); console.log('status_message=Refresh is active.');}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        if: steps.refresh_control.outputs.should_run == 'true'
        run: npm ci

      - name: Run tests
        if: steps.refresh_control.outputs.should_run == 'true'
        run: npm test

      - name: Refresh source cache (external sources)
        if: steps.refresh_control.outputs.should_run == 'true'
        env:
          PPS_EMAIL: ${{ secrets.PPS_EMAIL }}
          PPS_PASSWORD: ${{ secrets.PPS_PASSWORD }}
          NODE_OPTIONS: "--dns-result-order=ipv4first"
          WRITE_PUBLIC_OUTPUTS: "false"
          WRITE_ARCHIVE_OUTPUTS: "false"
          WRITE_RUNTIME_DERIVED: "false"
          WRITE_METRICS: "false"
          WRITE_RAW_OUTPUTS: "false"
          SOURCE_IDS: "rainviewer-radar,nasa-imerg-nrt"
        run: node scripts/run-pipeline.js

      - name: Commit refreshed data
        id: commit_refresh
        if: steps.refresh_control.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/cache/source-results.json data/manual/review-approvals.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "publish_required=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: refresh external sources"
            git pull --rebase --autostash origin main
            git push
            echo "publish_required=true" >> $GITHUB_OUTPUT
          fi

      - name: Dispatch publish workflow
        if: steps.refresh_control.outputs.should_run == 'true' && steps.commit_refresh.outputs.publish_required == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLISH_TRIGGER_SOURCE: refresh-data
        run: node scripts/dispatch-publish-workflow.js

      - name: Report paused refresh
        if: steps.refresh_control.outputs.should_run != 'true'
        run: echo "${{ steps.refresh_control.outputs.status_message }}"
